# Plain container. The hotel is the /data mount. The host port is HOTELDRUID_PORT.
# docker compose -f deploy/container/compose/plain.yml up --build

services:
  api:
    image: ${HOTELDRUID_IMAGE:-hoteldruid:local}
    build:
      context: ../../..
      dockerfile: deploy/container/Dockerfile
    container_name: HotelDruid-api
    restart: unless-stopped
    ports:
      - "${HOTELDRUID_PORT:-8080}:8080"
    volumes:
      - ${HOTELDRUID_DATA:-hoteldruid_data}:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HOTELDRUID_DATAROOT: /data
      Identity__Provider: ${IDENTITY_PROVIDER:-none}
      Identity__Issuer: ${IDENTITY_ISSUER:-}
      Identity__AdminConsoleUrl: ${IDENTITY_ADMIN_CONSOLE_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  hoteldruid_data:

